apply plugin: 'com.android.application'

android {
    compileSdkVersion 34 // Android 14 कंपाइलर

    defaultConfig {
        applicationId "com.android.support"
        minSdkVersion 21
        targetSdkVersion 34 // 🔥 Android 14 टारगेट लॉक किया ताकि Vivo Y29 में क्रैश न हो
        versionCode 1
        versionName "4.0"
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            shrinkResources false // गिटहब कंपाइलर एरर से बचने के लिए इसे फ़ाल्स किया
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    namespace "com.android.support"
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
